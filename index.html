<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Máy tính</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #111; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .screen { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
    align-items: flex-end; padding: 12px 8px; min-height: 0; }
  .expr { color: #888; font-size: 20px; min-height: 26px; }
  .value { font-size: 64px; font-weight: 300; line-height: 1.1; max-width: 100%;
    overflow: hidden; white-space: nowrap; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button { border: 0; border-radius: 50px; height: 72px; font-size: 28px; color: #fff;
    background: #333; cursor: pointer; transition: filter .1s; }
  button:active { filter: brightness(1.5); }
  button.fn { background: #a5a5a5; color: #000; }
  button.op { background: #ff9f0a; }
  button.op.active { background: #fff; color: #ff9f0a; }
  button.zero { grid-column: span 2; text-align: left; padding-left: 28px; }
  @media (max-height: 640px) { button { height: 56px; font-size: 22px; } .value { font-size: 48px; } }
</style>
</head>
<body>
<div class="app">
  <div class="screen">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="neg">±</button>
    <button class="fn" data-k="pct">%</button>
    <button class="op" data-k="/">÷</button>

    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*">×</button>

    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-">−</button>

    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>

    <button class="zero" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="op" data-k="=">=</button>
  </div>
</div>

<script>
(function () {
  var cur = "0", prev = null, op = null, fresh = true, err = false;
  var SYM = { "+": "+", "-": "−", "*": "×", "/": "÷" };
  var elV = document.getElementById("value");
  var elE = document.getElementById("expr");

  function calc(a, b, o) {
    a = parseFloat(a); b = parseFloat(b);
    var r;
    if (o === "+") r = a + b;
    else if (o === "-") r = a - b;
    else if (o === "*") r = a * b;
    else { if (b === 0) return null; r = a / b; }
    return String(parseFloat(r.toPrecision(12)));
  }

  function fmt(s) {
    if (err) return "Lỗi";
    if (s.indexOf("e") !== -1) return s;
    var neg = s[0] === "-"; if (neg) s = s.slice(1);
    var p = s.split(".");
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-" : "") + p[0] + (p.length > 1 ? "," + p[1] : "");
  }

  function render() {
    elV.textContent = fmt(cur);
    var len = elV.textContent.length;
    elV.style.fontSize = len > 12 ? "36px" : len > 9 ? "48px" : "";
    elE.textContent = (prev !== null && op) ? fmt(prev) + " " + SYM[op] : "";
    document.querySelectorAll(".op").forEach(function (b) {
      b.classList.toggle("active", fresh && op === b.dataset.k && b.dataset.k !== "=");
    });
  }

  function reset() { cur = "0"; prev = null; op = null; fresh = true; err = false; }

  function press(k) {
    if (err && k !== "C") return;
    if (/^\d$/.test(k)) {
      if (fresh) { cur = k; fresh = false; }
      else if (cur.replace(/[-.]/g, "").length < 15) cur = (cur === "0") ? k : cur + k;
    } else if (k === ".") {
      if (fresh) { cur = "0."; fresh = false; }
      else if (cur.indexOf(".") === -1) cur += ".";
    } else if (k === "C") {
      reset();
    } else if (k === "neg") {
      if (cur !== "0") cur = cur[0] === "-" ? cur.slice(1) : "-" + cur;
    } else if (k === "pct") {
      cur = String(parseFloat((parseFloat(cur) / 100).toPrecision(12)));
      fresh = true;
    } else if (k === "=") {
      if (op !== null && prev !== null) {
        var r = calc(prev, cur, op);
        if (r === null) { err = true; }
        else { cur = r; }
        prev = null; op = null; fresh = true;
      }
    } else { // + - * /
      if (op !== null && prev !== null && !fresh) {
        var r2 = calc(prev, cur, op);
        if (r2 === null) { err = true; prev = null; op = null; render(); return; }
        cur = r2;
      }
      prev = cur; op = k; fresh = true;
    }
    render();
  }

  document.getElementById("keys").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) press(b.dataset.k);
  });

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (/^\d$/.test(k) || "+-*/.".indexOf(k) !== -1) press(k);
    else if (k === "," ) press(".");
    else if (k === "Enter" || k === "=") { e.preventDefault(); press("="); }
    else if (k === "Escape" || k === "Delete") press("C");
    else if (k === "Backspace" && !fresh && !err) {
      cur = cur.length > 1 && cur !== "-0" ? cur.slice(0, -1) : "0";
      if (cur === "-") cur = "0";
      render();
    } else if (k === "%") press("pct");
  });

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
