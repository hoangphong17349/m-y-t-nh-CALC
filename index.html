<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Máy tính</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: #111; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
    padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); }

  .hhead { display: flex; justify-content: space-between; align-items: center;
    color: #666; font-size: 12px; padding: 0 4px; }
  button.link { height: auto; background: none; color: #888; font-size: 13px;
    border-radius: 6px; padding: 6px 8px; }
  .history { flex: 1; min-height: 0; overflow-y: auto; padding: 4px; }
  .history .inner { min-height: 100%; display: flex; flex-direction: column;
    justify-content: flex-end; gap: 8px; }
  .hempty { color: #555; text-align: center; font-size: 14px; margin: auto; }
  .hitem { display: flex; justify-content: space-between; align-items: flex-end;
    gap: 12px; cursor: pointer; padding: 4px 0; }
  .hitem .ago { color: #555; font-size: 12px; white-space: nowrap; }
  .hitem .r { text-align: right; min-width: 0; }
  .hitem .r small { display: block; color: #888; font-size: 15px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hitem .r b { display: block; color: #ddd; font-size: 22px; font-weight: 400;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .screen { padding: 8px 4px 12px; border-top: 1px solid #222; }
  .exprwrap { display: flex; overflow-x: auto; scrollbar-width: none; min-height: 68px; align-items: center; }
  .exprwrap::-webkit-scrollbar { display: none; }
  #main { margin-left: auto; white-space: nowrap; font-size: 56px; font-weight: 300; }
  #sub { text-align: right; color: #888; font-size: 24px; min-height: 32px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button { border: 0; border-radius: 50px; height: 66px; font-size: 28px; color: #fff;
    background: #333; cursor: pointer; transition: filter .1s; }
  button:active { filter: brightness(1.5); }
  button.fn { background: #a5a5a5; color: #000; }
  button.op { background: #ff9f0a; }
  @media (max-height: 700px) { button { height: 54px; font-size: 22px; } #main { font-size: 44px; } .exprwrap { min-height: 54px; } }
</style>
</head>
<body>
<div class="app">
  <div class="hhead"><span>Lịch sử · giữ 5 phút</span><button class="link" id="clearH">Xóa</button></div>
  <div class="history" id="history"></div>

  <div class="screen">
    <div class="exprwrap" id="wrap"><span id="main">0</span></div>
    <div id="sub"></div>
  </div>

  <div class="keys" id="keys">
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="back">⌫</button>
    <button class="fn" data-k="pct">%</button>
    <button class="op" data-k="/">÷</button>

    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*">×</button>

    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-">−</button>

    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>

    <button class="fn" data-k="par">( )</button>
    <button data-k="0">0</button>
    <button data-k=".">,</button>
    <button class="op" data-k="=">=</button>
  </div>
</div>

<script>
// ENGINE START
function evaluate(s) {
  var i = 0;
  function peek() { return s[i]; }
  function num() {
    var st = i;
    while (i < s.length && /[0-9.]/.test(s[i])) i++;
    var t = s.slice(st, i);
    if (t === "" || t === "." || isNaN(Number(t))) throw new Error("num");
    return Number(t);
  }
  function primary() {
    if (peek() === "(") {
      i++; var v = expr();
      if (peek() !== ")") throw new Error("paren");
      i++; return v;
    }
    return num();
  }
  function postfix() { var v = primary(); while (peek() === "%") { i++; v = v / 100; } return v; }
  function unary() {
    if (peek() === "-") { i++; return -unary(); }
    if (peek() === "+") { i++; return unary(); }
    return postfix();
  }
  function term() {
    var v = unary();
    while (peek() === "*" || peek() === "/") {
      var o = s[i++], r = unary();
      v = (o === "*") ? v * r : v / r;
    }
    return v;
  }
  function expr() {
    var v = term();
    while (peek() === "+" || peek() === "-") {
      var o = s[i++], r = term();
      v = (o === "+") ? v + r : v - r;
    }
    return v;
  }
  var v = expr();
  if (i !== s.length || !isFinite(v)) throw new Error("bad");
  return v;
}

function prepare(src) {
  var s = src.replace(/[+\-*\/.(]+$/, "");
  var o = (s.match(/\(/g) || []).length, c = (s.match(/\)/g) || []).length;
  while (c < o) { s += ")"; c++; }
  return s;
}
function hasOps(s) { return /[+*\/%()]|[0-9)%]-/.test(s); }
function fmtResult(v) { return String(parseFloat(v.toPrecision(12))); }
function plain(r) {
  if (r == null) return "";
  if (!/e/i.test(r)) return r;
  return Number(r).toLocaleString("en-US", { useGrouping: false, maximumFractionDigits: 20 });
}
function fmtNum(t) {
  if (/e/i.test(t)) return t.replace(".", ",");
  var p = t.split(".");
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return p.length > 1 ? p[0] + "," + p[1] : p[0];
}
function fmtExpr(e) {
  return e.replace(/([0-9.]+(?:e[+-]?\d+)?)|([*\/-])/gi, function (m, n, o) {
    if (n) return fmtNum(n);
    return o === "*" ? "×" : o === "/" ? "÷" : "−";
  });
}

// st = { expr, mode: "edit" | "result" | "error", lastResult, lastExpr }
// Trả về { e, r } khi vừa tính xong một phép tính (để lưu lịch sử), ngược lại null.
function press(st, k) {
  if (st.mode === "error") {
    st.expr = ""; st.mode = "edit";
    if (k === "C" || k === "=" || k === "back") return null;
  } else if (st.mode === "result") {
    if (k === "=") return null;
    if (k === "C") { st.expr = ""; st.mode = "edit"; return null; }
    if (/^\d$/.test(k) || k === "." || k === "par") st.expr = "";
    else st.expr = plain(st.lastResult);
    st.mode = "edit";
  }

  var x = st.expr, last = x.slice(-1), num;
  var isNumEnd = /[0-9)%]/.test(last);

  if (k === "C") {
    x = "";
  } else if (/^\d$/.test(k)) {
    if (last === "%" || last === ")") x += "*";
    num = (x.match(/[0-9.]*$/) || [""])[0];
    if (num === "0") x = x.slice(0, -1) + k;
    else if (num.replace(".", "").length >= 15) { /* đủ 15 chữ số */ }
    else x += k;
  } else if (k === ".") {
    if (last === "%" || last === ")") x += "*0.";
    else {
      num = (x.match(/[0-9.]*$/) || [""])[0];
      if (num === "") x += "0.";
      else if (num.indexOf(".") === -1) x += ".";
    }
  } else if ("+-*/".indexOf(k) !== -1) {
    x = x.replace(/\.$/, ""); last = x.slice(-1);
    if (x === "") x = (k === "-") ? "-" : "0" + k;
    else if (last === "(") { if (k === "-") x += "-"; }
    else if (/[+\-*\/]/.test(last)) {
      if (k === "-" && (last === "*" || last === "/")) x += "-";
      else {
        var base = x.replace(/[+\-*\/]+$/, "");
        x = (base === "") ? (k === "-" ? "-" : "") : base + k;
      }
    } else x += k;
  } else if (k === "pct") {
    if (isNumEnd) x += "%";
  } else if (k === "par") {
    var o = (x.match(/\(/g) || []).length, c = (x.match(/\)/g) || []).length;
    if (isNumEnd) x += (o > c) ? ")" : "*(";
    else if (last !== ".") x += "(";
  } else if (k === "back") {
    x = x.slice(0, -1);
  } else if (k === "=") {
    var s = prepare(x);
    st.expr = x;
    if (s === "" || !hasOps(s)) return null;
    try {
      var r = fmtResult(evaluate(s));
      st.lastExpr = s; st.lastResult = r; st.mode = "result";
      return { e: s, r: r };
    } catch (err) {
      st.lastExpr = s; st.lastResult = null; st.mode = "error";
      return null;
    }
  }
  st.expr = x;
  return null;
}

function preview(st) {
  if (st.mode !== "edit") return "";
  try {
    var s = prepare(st.expr);
    if (s && hasOps(s)) return fmtExpr(fmtResult(evaluate(s)));
  } catch (e) {}
  return "";
}
// ENGINE END

(function () {
  var st = { expr: "", mode: "edit", lastResult: null, lastExpr: "" };
  var TTL = 5 * 60 * 1000, KEY = "calc-history-v1";
  var hist = [];
  var elM = document.getElementById("main"), elS = document.getElementById("sub");
  var elW = document.getElementById("wrap"), elH = document.getElementById("history");

  function loadHist() {
    try {
      var a = JSON.parse(localStorage.getItem(KEY) || "[]");
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function saveHist() { try { localStorage.setItem(KEY, JSON.stringify(hist)); } catch (e) {} }
  function ago(t) {
    var m = Math.floor((Date.now() - t) / 60000);
    return m < 1 ? "vừa xong" : m + " phút trước";
  }

  function renderHist() {
    var atBottom = elH.scrollHeight - elH.scrollTop - elH.clientHeight < 24;
    var prevTop = elH.scrollTop;
    elH.textContent = "";
    var inner = document.createElement("div");
    inner.className = "inner";
    if (!hist.length) {
      var em = document.createElement("div");
      em.className = "hempty"; em.textContent = "Chưa có phép tính nào";
      inner.appendChild(em);
    }
    hist.forEach(function (h, i) {
      var d = document.createElement("div"); d.className = "hitem"; d.dataset.i = i;
      var a = document.createElement("span"); a.className = "ago"; a.textContent = ago(h.t);
      var r = document.createElement("div"); r.className = "r";
      var sm = document.createElement("small"); sm.textContent = fmtExpr(h.e) + " =";
      var b = document.createElement("b"); b.textContent = fmtExpr(h.r);
      r.appendChild(sm); r.appendChild(b);
      d.appendChild(a); d.appendChild(r); inner.appendChild(d);
    });
    elH.appendChild(inner);
    elH.scrollTop = atBottom ? elH.scrollHeight : prevTop;
  }

  function prune() {
    var now = Date.now(), n = hist.length;
    hist = hist.filter(function (h) { return now - h.t < TTL; });
    if (hist.length !== n) saveHist();
    renderHist();
  }

  function render() {
    var main, sub;
    if (st.mode === "result") { main = fmtExpr(st.lastResult); sub = fmtExpr(st.lastExpr) + " ="; }
    else if (st.mode === "error") { main = "Lỗi"; sub = fmtExpr(st.expr); }
    else { main = st.expr === "" ? "0" : fmtExpr(st.expr); sub = preview(st); }
    elM.textContent = main; elS.textContent = sub;
    var n = main.length;
    elM.style.fontSize = n > 20 ? "30px" : n > 14 ? "38px" : n > 9 ? "46px" : "";
    elW.scrollLeft = elW.scrollWidth;
  }

  function onKey(k) {
    var en = press(st, k);
    if (en) {
      hist.push({ e: en.e, r: en.r, t: Date.now() });
      if (hist.length > 50) hist.shift();
      saveHist(); renderHist();
      elH.scrollTop = elH.scrollHeight;
    }
    render();
  }

  document.getElementById("keys").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) onKey(b.dataset.k);
  });
  elH.addEventListener("click", function (e) {
    var it = e.target.closest(".hitem");
    if (!it || !hist[it.dataset.i]) return;
    st.expr = plain(hist[it.dataset.i].r); st.mode = "edit"; render();
  });
  document.getElementById("clearH").addEventListener("click", function () {
    hist = []; saveHist(); renderHist();
  });

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^\d$/.test(k) || "+-*/".indexOf(k) !== -1) onKey(k);
    else if (k === "." || k === ",") onKey(".");
    else if (k === "(" || k === ")") onKey("par");
    else if (k === "%") onKey("pct");
    else if (k === "Enter" || k === "=") { e.preventDefault(); onKey("="); }
    else if (k === "Escape" || k === "Delete") onKey("C");
    else if (k === "Backspace") onKey("back");
  });

  document.addEventListener("visibilitychange", function () { if (!document.hidden) prune(); });
  setInterval(prune, 15000);

  hist = loadHist();
  prune();
  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
